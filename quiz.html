<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frontend Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<button id="home">⌘ Frontend Quiz</button>
<button id="theme">☾</button>
</header>

<main>
<section id="start" class="screen">
<p class="eyebrow">TEST YOUR FRONTEND KNOWLEDGE</p>
<h1>Welcome to the<br><b>Frontend Quiz!</b></h1>
<p>10 mixed questions about HTML, CSS and JavaScript.</p>
<button id="startBtn" class="primary">Start Quiz</button>
</section>

<section id="quiz" class="screen hidden">
<div class="top">
<span>Question <b id="number">1</b> of 10</span>
</div>
<div class="bar"><span id="progress"></span></div>
<p class="tag" id="topic">HTML</p>
<h2 id="question"></h2>
<div id="answers"></div>
<p id="feedback"></p>
<div class="nav">
<button id="back" class="secondary" disabled>Back</button>
<button id="next" class="primary" disabled>Next</button>
</div>
</section>

<section id="result" class="screen hidden">
<p class="eyebrow">QUIZ COMPLETE</p>
<h1>Your score</h1>
<div class="final"><b id="finalScore">0</b>/10</div>
<p id="message"></p>
<div class="nav">
<button id="showAnswers" class="secondary">Show Answers</button>
<button id="again" class="primary">Try Again</button>
</div>
</section>

<section id="answersPage" class="screen hidden">
<p class="eyebrow">ANSWER REVIEW</p>
<h1>Questions &amp; Answers</h1>
<div id="review"></div>
<button id="backToResult" class="primary">Back to Results</button>
</section>
</main>

<footer>Built with HTML, CSS & JavaScript</footer>
<script src="behave.js"></script>
</body>
</html>
